<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公文摘要情況結果</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --panel-bg: #ffffff;
            --text-title: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --tech-blue: #2563eb;
            --tech-blue-bg: rgba(37, 99, 233, 0.06);
            --tech-gray-bg: #f8fafc;
            --tech-gray-border: #cbd5e1;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.08);
            --warning: #b45309;
            --warning-bg: rgba(245, 158, 11, 0.10);
            --warning-border: rgba(245, 158, 11, 0.30);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", monospace;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.7;
            margin: 0;
            padding: 50px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .header-section {
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 20px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-title);
            margin: 0 0 6px 0;
            letter-spacing: -0.3px;
        }

        .header-title p {
            color: var(--text-muted);
            margin: 0;
            font-size: 13px;
            font-weight: 500;
        }

        .count-summary-container {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .count-summary-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-title);
        }

        .count-number {
            color: var(--tech-blue);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 22px;
            margin: 0 4px;
        }

        .pending-note {
            font-size: 12px;
            font-weight: 600;
            color: var(--warning);
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: 999px;
            padding: 3px 12px;
        }

        .search-container { position: relative; margin-bottom: 30px; }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px 12px 46px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--panel-bg);
            color: var(--text-title);
            outline: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-input:focus {
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.04);
        }

        .section-divider {
            display: flex;
            align-items: center;
            margin: 40px 0 24px 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .section-divider::after {
            content: '';
            flex: 1;
            margin-left: 16px;
            height: 1px;
            background-color: var(--border-light);
        }

        .status-message {
            padding: 40px;
            background: var(--panel-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .summary-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 26px;
            margin-bottom: 22px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .summary-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.02);
        }

        .summary-card.is-read {
            background-color: #fafafa;
            opacity: 0.65;
            box-shadow: none;
            border-color: var(--border-light);
        }
        .summary-card.is-read:hover {
            box-shadow: none;
            border-color: var(--border-light);
        }

        .grid-row { display: flex; flex-direction: column; gap: 20px; }

        .field-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 14px;
        }

        .field-group { display: flex; flex-direction: column; gap: 6px; }

        .field-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .field-value {
            font-size: 14px;
            color: var(--text-main);
            margin: 0;
            white-space: pre-line;
        }

        .field-value.title-highlight {
            font-weight: 600;
            color: var(--text-title);
            font-size: 15px;
        }

        /* ── 指派 / 知會 ── */
        .people-row {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .people-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1 1 200px;
            min-width: 0;
        }

        .person-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .person-chip {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            background-color: var(--tech-gray-bg);
            border: 1px solid var(--border-light);
            border-radius: 999px;
            padding: 3px 11px;
            white-space: nowrap;
        }

        .person-chip.assignee {
            background-color: var(--tech-blue-bg);
            border-color: rgba(37, 99, 233, 0.18);
            color: var(--tech-blue);
        }

        .person-chip.unknown {
            background-color: var(--warning-bg);
            border-color: var(--warning-border);
            color: var(--warning);
        }

        .summary-card.is-read .person-chip {
            background-color: #e2e8f0;
            border-color: #e2e8f0;
            color: #475569;
        }

        .comment-box-wrapper { position: relative; margin-top: 2px; }

        .comment-box {
            background-color: var(--tech-gray-bg);
            padding: 14px 18px;
            border-radius: 6px;
            border: 1px solid var(--border-light);
            border-left: 3px solid #475569;
        }

        .summary-card.is-read .comment-box {
            background-color: #f1f5f9;
            border-left-color: #94a3b8;
        }

        .comment-box .field-value {
            color: #1e293b;
            font-weight: 500;
            padding-right: 80px;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background-color: #ffffff;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            z-index: 10;
        }

        .copy-btn:hover {
            color: var(--text-title);
            border-color: var(--tech-gray-border);
            background-color: var(--tech-gray-bg);
        }

        .copy-btn svg { width: 13px; height: 13px; }

        .badge {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: var(--tech-blue-bg);
            color: var(--tech-blue);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .summary-card.is-read .badge {
            background-color: #e2e8f0;
            color: #475569;
        }

        .action-btn {
            background-color: #ffffff;
            border: 1px solid var(--tech-gray-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .action-btn:hover {
            background-color: var(--tech-gray-bg);
            color: var(--text-title);
            border-color: #94a3b8;
        }

        .action-btn.checked {
            background-color: var(--success-bg);
            border-color: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        .action-btn.checked:hover {
            background-color: var(--success);
            border-color: var(--success);
            color: #ffffff;
        }

        .action-btn:disabled,
        .action-btn:disabled:hover {
            opacity: 0.45;
            cursor: not-allowed;
            background-color: #ffffff;
            color: var(--text-main);
            border-color: var(--tech-gray-border);
        }

        /* ── 回饋服務狀態 ── */
        .server-pill {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            background-color: var(--tech-gray-bg);
            border: 1px solid var(--border-light);
            border-radius: 999px;
            padding: 3px 12px;
        }
        .server-pill.online {
            color: var(--success);
            background-color: var(--success-bg);
            border-color: rgba(16, 185, 129, 0.25);
        }
        .server-pill.offline {
            color: var(--warning);
            background-color: var(--warning-bg);
            border-color: var(--warning-border);
        }

        /* ── Feedback ── */
        .feedback-box {
            border: 1px dashed var(--tech-gray-border);
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .star-row { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }

        .star-btn {
            background: none;
            border: none;
            padding: 0 2px;
            font-size: 22px;
            line-height: 1;
            color: #cbd5e1;
            cursor: pointer;
            transition: color 0.1s ease, transform 0.1s ease;
        }
        .star-btn:hover { transform: scale(1.12); }
        .star-btn.on { color: #f59e0b; }

        .score-hint { font-size: 12px; color: var(--text-muted); margin-left: 8px; }

        .fb-textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 60px;
            resize: vertical;
            padding: 8px 10px;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font: inherit;
            font-size: 13px;
            color: var(--text-title);
            background-color: var(--panel-bg);
            outline: none;
        }
        .fb-textarea:focus { border-color: #94a3b8; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.04); }
        .fb-textarea.required-missing { border-color: var(--warning-border); background-color: var(--warning-bg); }

        .fb-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }

        .fb-status { font-size: 12px; color: var(--text-muted); }
        .fb-status.ok { color: var(--success); }
        .fb-status.warn { color: var(--warning); }
        .fb-status.err { color: #ef4444; }

        .fb-done {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            font-size: 13px;
        }
        .fb-done-stars { color: #f59e0b; letter-spacing: 1px; }
        .fb-done-text { color: var(--text-main); white-space: pre-line; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">

    <div class="header-section">
        <div class="header-title">
            <h1>公文摘要情況結果</h1>
            <p>DATA AGENT INTEGRATED CONTROL PANEL</p>
        </div>
    </div>

    <div class="count-summary-container">
        <div class="count-summary-text">
            目前共有<span id="pending-count" class="count-number">0</span>件公文待簽核
        </div>
        <span id="unknown-note" class="pending-note" style="display:none;"></span>
        <span id="fb-server" class="server-pill">回饋服務連線中…</span>
    </div>

    <div class="search-container">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="search-box" class="search-input" placeholder="鍵入來文字號、主旨或人員姓名進行過濾..." />
    </div>

    <div id="summary-container">
        <div class="status-message">正在連結核心數據模組 (data/officialdoc.json)...</div>
    </div>

</div>

<script>
    // ===== 回饋服務設定 =====
    // feedback_server.py 跑在哪台電腦，就填那台的 IP（在那台電腦開 cmd 打 ipconfig 看 IPv4 位址）。
    // 測試時可在網址後面加 ?fbapi=http://127.0.0.1:8765 臨時覆蓋。
    const FEEDBACK_API = (new URLSearchParams(location.search).get('fbapi')
                          || 'http://YOUR-PC-IP:8765').replace(/\/+$/, '');
    const FEEDBACK_TIMEOUT_MS = 5000;
    const QUEUE_KEY = 'officialdoc_feedback_queue';     // 送不出去的回饋先暫存在瀏覽器

    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("summary-container");
        const pendingCountSpan = document.getElementById("pending-count");
        const unknownNote = document.getElementById("unknown-note");
        const searchBox = document.getElementById("search-box");
        const serverPill = document.getElementById("fb-server");

        let allDocs = [];

        // localStorage 在無痕模式或被封鎖時會丟例外，一律包起來
        function storageGet(key, fallback) {
            try {
                const v = localStorage.getItem(key);
                return v == null ? fallback : JSON.parse(v);
            } catch (e) { return fallback; }
        }
        function storageSet(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 忽略 */ }
        }

        // 資料來自 LLM，一律轉義後才放進 innerHTML
        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // "ABC、DEF" → ['ABC', 'DEF']；也接受逗號、分號分隔
        function splitPeople(value) {
            return String(value == null ? '' : value)
                .split(/[、,，;；\/]/)
                .map(s => s.trim())
                .filter(Boolean);
        }

        function renderPeople(value, kind) {
            const names = splitPeople(value);
            if (names.length === 0) {
                return `<span class="person-chip unknown">未提供</span>`;
            }
            return names.map(n => {
                const isUnknown = (n === '待確認' || n === '未提供');
                const cls = isUnknown ? 'unknown' : (kind === 'assignee' ? 'assignee' : '');
                return `<span class="person-chip ${cls}">${escapeHtml(n)}</span>`;
            }).join('');
        }

        async function loadOfficialDocs() {
            const timestamp = Date.now();
            try {
                const res = await fetch(`data/officialdoc.json?t=${timestamp}`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP 錯誤！狀態碼: ${res.status}`);

                let text = await res.text();
                const scriptIndex = text.indexOf('<script>');
                if (scriptIndex !== -1) text = text.slice(0, scriptIndex).trim();

                const data = JSON.parse(text);

                // ===== 萬用資料讀取：不管包在什麼 key 裡都能抓 =====
                let rawDocs = [];
                if (Array.isArray(data)) {
                    rawDocs = data;
                } else if (data && typeof data === 'object') {
                    // 常見 key 先試，再自動找物件裡第一個陣列
                    rawDocs = data.results || data.documents || data.data || data.list || data.items;
                    if (!Array.isArray(rawDocs)) {
                        rawDocs = Object.values(data).find(v => Array.isArray(v)) || [data];
                    }
                }
                // =================================================

                // _id 用索引，按鈕就不必把字號串進 onclick 的引號裡
                allDocs = rawDocs.map((item, i) => ({ ...item, _id: i, isRead: false, _fb: newFeedbackState() }));

                if (allDocs.length > 0) {
                    renderCards();
                    syncFeedback();
                } else {
                    pendingCountSpan.innerText = "0";
                    container.innerHTML = `<div class="status-message">沒有找到任何公文紀錄。</div>`;
                }
            } catch (e) {
                console.error("Data load failed:", e);
                pendingCountSpan.innerText = "ERROR";
                container.innerHTML = `<div class="status-message" style="color: #ef4444;">資料格式解析錯誤，請確認 JSON 是否為合規的陣列或物件。</div>`;
            }
        }

        searchBox.addEventListener("input", renderCards);

        function matchesKeyword(item, keyword) {
            if (!keyword) return true;
            const haystack = [
                item.來文字號, item.主旨,
                item.指派人員, item.知會人員
            ].map(v => String(v == null ? '' : v).toLowerCase()).join(' ');
            return haystack.includes(keyword);
        }

        function renderCards() {
            container.innerHTML = "";
            const keyword = searchBox.value.trim().toLowerCase();

            let filteredDocs = allDocs.filter(item => matchesKeyword(item, keyword));

            const unreadDocs = filteredDocs.filter(d => !d.isRead);
            const readDocs = filteredDocs.filter(d => d.isRead);

            pendingCountSpan.innerText = unreadDocs.length;

            // 提醒有幾件的指派/知會需要人工確認
            const needsAttention = unreadDocs.filter(d =>
                splitPeople(d.指派人員).includes('待確認') ||
                splitPeople(d.知會人員).includes('待確認') ||
                !d.指派人員 || !d.知會人員
            ).length;

            if (needsAttention > 0) {
                unknownNote.style.display = "";
                unknownNote.innerText = `其中 ${needsAttention} 件的指派/知會待確認`;
            } else {
                unknownNote.style.display = "none";
            }

            if (filteredDocs.length === 0) {
                container.innerHTML = `<div class="status-message">未找到符合條件的公文紀錄。</div>`;
                return;
            }

            unreadDocs.forEach(item => createCardElement(item));

            if (readDocs.length > 0) {
                const divider = document.createElement("div");
                divider.className = "section-divider";
                divider.innerText = "ARCHIVED DOCUMENTS";
                container.appendChild(divider);
                readDocs.forEach(item => createCardElement(item));
            }
        }

        // ===================== Feedback =====================

        const SCORE_HINTS = {
            0: '點星星替這則 comment 評分',
            1: '1 分：完全不對',
            2: '2 分：大部分不對',
            3: '3 分：方向對，但要大改',
            4: '4 分：小地方要修',
            5: '5 分：就是我要的，不需要填原因'
        };

        function newFeedbackState() {
            return { score: 0, reason: '', suggestion: '', editing: false,
                     sending: false, status: '', statusKind: '', submitted: null };
        }

        // 一篇公文的識別。規則必須跟 feedback_knowledge.py 的 doc_key() 一致
        function docKey(item) {
            const no = String(item.來文字號 == null ? '' : item.來文字號).trim();
            if (!['', 'nan', 'none', '—', '-', '無'].includes(no.toLowerCase())) return no;
            return String(item.主旨 == null ? '' : item.主旨).trim();
        }

        // 比對 comment 是否同一則（跟 pipeline 的 norm() 一樣：全形轉半形、去空白、轉小寫）
        function normText(s) {
            return String(s == null ? '' : s).normalize('NFKC').replace(/\s+/g, '').toLowerCase();
        }

        function findDoc(id) { return allDocs.find(d => d._id === id); }

        function canSubmit(fb) {
            return !fb.sending && fb.score >= 1 && (fb.score === 5 || fb.reason.trim().length > 0);
        }

        function starText(score) { return '★'.repeat(score) + '☆'.repeat(5 - score); }

        function setServerStatus(online) {
            serverPill.className = `server-pill ${online ? 'online' : 'offline'}`;
            serverPill.innerText = online ? '回饋服務：已連線' : '回饋服務：未連線（回饋會先暫存在這台電腦）';
        }

        async function fetchWithTimeout(url, options = {}) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), FEEDBACK_TIMEOUT_MS);
            try {
                return await fetch(url, { ...options, signal: ctrl.signal });
            } finally {
                clearTimeout(timer);
            }
        }

        // 連線失敗會丟例外；伺服器有回應時回傳 { ok, status, data }
        async function postFeedback(payload) {
            const res = await fetchWithTimeout(`${FEEDBACK_API}/feedback`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            let data = null;
            try { data = await res.json(); } catch (e) { /* 非 JSON 回應 */ }
            return { ok: res.ok && !!(data && data.ok), status: res.status, data };
        }

        function enqueue(payload) {
            const queue = storageGet(QUEUE_KEY, []);
            queue.push(payload);
            storageSet(QUEUE_KEY, queue);
        }

        // 把之前送不出去的回饋補送。連不上就停，剩下的留到下次
        async function flushQueue() {
            const queue = storageGet(QUEUE_KEY, []);
            if (queue.length === 0) return;
            const remaining = [];
            for (let i = 0; i < queue.length; i++) {
                try {
                    const r = await postFeedback(queue[i]);
                    if (!r.ok && r.status >= 500) remaining.push(queue[i]);
                    // 4xx 是資料本身被拒收，重送也不會過，直接丟掉
                } catch (e) {
                    remaining.push(...queue.slice(i));
                    break;
                }
            }
            storageSet(QUEUE_KEY, remaining);
        }

        // 讀伺服器上「每篇最新一筆回饋」，評的是目前這則 comment 才顯示成已回饋
        async function syncFeedback() {
            await flushQueue();

            let latest = {};
            try {
                const res = await fetchWithTimeout(`${FEEDBACK_API}/feedback/latest`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                latest = (data && data.items) || {};
                setServerStatus(true);
            } catch (e) {
                console.warn('回饋服務連不上：', FEEDBACK_API, e);
                setServerStatus(false);
            }

            const queued = storageGet(QUEUE_KEY, []);
            allDocs.forEach(item => {
                const key = docKey(item);
                const sameComment = r => normText(r.comment) === normText(item.comment);
                const q = queued.slice().reverse().find(p => docKey(p) === key && sameComment(p));
                const s = latest[key];
                if (q) {
                    item._fb.submitted = { ...q, queued: true };
                } else if (s && sameComment(s)) {
                    item._fb.submitted = s;
                }
            });
            renderCards();
        }

        function renderFeedback(item) {
            const fb = item._fb;
            const id = item._id;

            if (fb.submitted && !fb.editing) {
                const s = fb.submitted;
                const meta = s.queued
                    ? '<span class="fb-status warn">已暫存在這台電腦，回饋服務連上後會自動補送</span>'
                    : '<span class="fb-status ok">已回饋</span>';
                return `
                    <div class="feedback-box">
                        <div class="fb-done">
                            <div>
                                <div><span class="fb-done-stars">${starText(s.score)}</span> <strong>${s.score} 分</strong> ${meta}</div>
                                ${s.reason ? `<div class="fb-done-text">原因：${escapeHtml(s.reason)}</div>` : ''}
                                ${s.suggested_comment ? `<div class="fb-done-text">建議 comment：${escapeHtml(s.suggested_comment)}</div>` : ''}
                            </div>
                            <button class="action-btn" onclick="editFeedback(${id})">修改</button>
                        </div>
                    </div>`;
            }

            const needReason = fb.score > 0 && fb.score < 5;
            const stars = [1, 2, 3, 4, 5].map(n =>
                `<button type="button" class="star-btn ${n <= fb.score ? 'on' : ''}" onclick="setScore(${id}, ${n})" aria-label="${n} 分" title="${n} 分">★</button>`
            ).join('');

            return `
                <div class="feedback-box">
                    <div class="star-row">${stars}<span class="score-hint">${SCORE_HINTS[fb.score]}</span></div>
                    ${needReason ? `
                    <textarea class="fb-textarea fb-reason ${fb.reason.trim() ? '' : 'required-missing'}"
                              placeholder="哪裡不是你要的？（必填）例：K11 屬二園區，應該指派 Dino；知會少了 Ellis"
                              oninput="setFeedbackText(${id}, 'reason', this)">${escapeHtml(fb.reason)}</textarea>
                    <textarea class="fb-textarea"
                              placeholder="（選填）你希望的 comment 長這樣…"
                              oninput="setFeedbackText(${id}, 'suggestion', this)">${escapeHtml(fb.suggestion)}</textarea>` : ''}
                    <div class="fb-actions">
                        <button class="action-btn fb-submit" onclick="submitFeedback(${id})" ${canSubmit(fb) ? '' : 'disabled'}>${fb.sending ? '送出中…' : '送出回饋'}</button>
                        ${fb.submitted ? `<button class="action-btn" onclick="cancelFeedbackEdit(${id})">取消</button>` : ''}
                        <span class="fb-status ${fb.statusKind}">${escapeHtml(fb.status)}</span>
                    </div>
                </div>`;
        }

        // 只重畫那一張卡的回饋區，不重畫整頁（才不會打字打到一半失去焦點）
        function renderFeedbackSlot(item) {
            const slot = container.querySelector(`.summary-card[data-id="${item._id}"] .fb-slot`);
            if (slot) slot.innerHTML = renderFeedback(item);
            return slot;
        }

        window.setScore = function(id, score) {
            const item = findDoc(id);
            if (!item) return;
            item._fb.score = score;
            item._fb.status = '';
            const slot = renderFeedbackSlot(item);
            const reason = slot && slot.querySelector('.fb-reason');
            if (reason) reason.focus();
        };

        window.setFeedbackText = function(id, field, el) {
            const item = findDoc(id);
            if (!item) return;
            item._fb[field] = el.value;
            const btn = el.closest('.fb-slot').querySelector('.fb-submit');
            if (btn) btn.disabled = !canSubmit(item._fb);
            if (field === 'reason') el.classList.toggle('required-missing', !el.value.trim());
        };

        window.editFeedback = function(id) {
            const item = findDoc(id);
            if (!item || !item._fb.submitted) return;
            const s = item._fb.submitted;
            Object.assign(item._fb, {
                editing: true, score: s.score, reason: s.reason || '',
                suggestion: s.suggested_comment || '', status: '', statusKind: ''
            });
            renderFeedbackSlot(item);
        };

        window.cancelFeedbackEdit = function(id) {
            const item = findDoc(id);
            if (!item) return;
            item._fb.editing = false;
            renderFeedbackSlot(item);
        };

        window.submitFeedback = async function(id) {
            const item = findDoc(id);
            if (!item || !canSubmit(item._fb)) return;
            const fb = item._fb;
            const lowScore = fb.score < 5;

            const payload = {
                來文字號: item.來文字號 || '',
                主旨: item.主旨 || '',
                summary: item.summary || '',
                指派人員: item.指派人員 || '',
                知會人員: item.知會人員 || '',
                comment: item.comment || '',
                score: fb.score,
                reason: lowScore ? fb.reason.trim() : '',
                suggested_comment: lowScore ? fb.suggestion.trim() : ''
            };

            fb.sending = true;
            fb.status = '';
            renderFeedbackSlot(item);

            try {
                const r = await postFeedback(payload);
                if (r.ok) {
                    fb.submitted = { ...payload };
                    fb.editing = false;
                    setServerStatus(true);
                } else if (r.status >= 500) {
                    enqueue(payload);
                    fb.submitted = { ...payload, queued: true };
                    fb.editing = false;
                } else {
                    fb.status = (r.data && r.data.error) || `回饋服務回應 HTTP ${r.status}`;
                    fb.statusKind = 'err';
                }
            } catch (e) {
                // 連不上：先存在這台電腦的瀏覽器，下次開頁面時自動補送
                enqueue(payload);
                fb.submitted = { ...payload, queued: true };
                fb.editing = false;
                setServerStatus(false);
            }

            fb.sending = false;
            renderFeedbackSlot(item);
        };

        // ====================================================

        function createCardElement(item) {
            const card = document.createElement("div");
            card.className = `summary-card ${item.isRead ? 'is-read' : ''}`;
            card.dataset.id = item._id;

            card.innerHTML = `
                <div class="grid-row">
                    <div class="field-header-row">
                        <div class="field-group">
                            <span class="field-label">來文字號</span>
                            <div><span class="badge">${escapeHtml(item.來文字號 || '無')}</span></div>
                        </div>
                        <div>
                            <button class="action-btn ${item.isRead ? 'checked' : ''}" onclick="toggleReadStatus(${item._id})">
                                ${item.isRead ? '✓ 已閱' : '標記已閱'}
                            </button>
                        </div>
                    </div>

                    <div class="field-group">
                        <span class="field-label">主旨</span>
                        <p class="field-value title-highlight">${escapeHtml(item.主旨 || '無')}</p>
                    </div>

                    <div class="field-group">
                        <span class="field-label">Summary (摘要)</span>
                        <p class="field-value">${escapeHtml(item.summary || '無')}</p>
                    </div>

                    <div class="people-row">
                        <div class="people-col">
                            <span class="field-label">指派人員</span>
                            <div class="person-list">${renderPeople(item.指派人員, 'assignee')}</div>
                        </div>
                        <div class="people-col">
                            <span class="field-label">知會人員</span>
                            <div class="person-list">${renderPeople(item.知會人員, 'notify')}</div>
                        </div>
                    </div>

                    <div class="field-group">
                        <span class="field-label">Comment (建議與後續追蹤)</span>
                        <div class="comment-box-wrapper">
                            <button class="copy-btn" onclick="copyComment(this)">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                                </svg>
                                <span>複製</span>
                            </button>
                            <div class="comment-box">
                                <p class="field-target-text field-value">${escapeHtml(item.comment || '無')}</p>
                            </div>
                        </div>
                    </div>

                    <div class="field-group">
                        <span class="field-label">Feedback (這則 comment 是你要的嗎？)</span>
                        <div class="fb-slot">${renderFeedback(item)}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        }

        window.toggleReadStatus = function(docId) {
            const doc = allDocs.find(item => item._id === docId);
            if (doc) {
                doc.isRead = !doc.isRead;
                renderCards();
            }
        };

        window.copyComment = function(btn) {
            const wrapper = btn.closest('.comment-box-wrapper');
            const targetTextElement = wrapper.querySelector('.field-target-text');

            if (!targetTextElement) return;
            const textToCopy = targetTextElement.innerText;

            const showSuccessUI = () => {
                const textSpan = btn.querySelector('span');
                textSpan.innerText = "已複製";
                btn.style.color = "var(--success)";
                btn.style.borderColor = "rgba(16, 185, 129, 0.3)";
                btn.style.backgroundColor = "var(--success-bg)";

                setTimeout(() => {
                    textSpan.innerText = "複製";
                    btn.style.color = "";
                    btn.style.borderColor = "";
                    btn.style.backgroundColor = "";
                }, 1500);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showSuccessUI();
                }).catch(err => {
                    console.warn('新版 API 被瀏覽器拒絕，切換至備援機制。', err);
                    fallbackCopy(textToCopy, showSuccessUI);
                });
            } else {
                fallbackCopy(textToCopy, showSuccessUI);
            }
        };

        function fallbackCopy(text, successCallback) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.width = "2em";
            textArea.style.height = "2em";
            textArea.style.padding = "0";
            textArea.style.border = "none";
            textArea.style.outline = "none";
            textArea.style.boxShadow = "none";
            textArea.style.background = "transparent";

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    successCallback();
                } else {
                    alert('複製失敗，請手動選取文字');
                }
            } catch (err) {
                console.error('備援複製依舊失敗: ', err);
            }

            document.body.removeChild(textArea);
        }

        loadOfficialDocs();
    });
</script>

</body>
</html>
